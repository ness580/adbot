<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <i class="pi pi-shield"></i>
        <h1>ADBot</h1>
      </div>
      <p class="subtitle">Active Directory Management</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()" (keypress)="onKeyPress($event)">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <div class="input-wrapper">
          <i class="pi pi-user input-icon"></i>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Entrez votre nom d'utilisateur"
            required
            [disabled]="isLoading"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <i class="pi pi-lock input-icon"></i>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Entrez votre mot de passe"
            required
            [disabled]="isLoading"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
          >
            <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <i class="pi pi-exclamation-triangle"></i>
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading || !username || !password"
      >
        <div class="button-content">
          <div class="spinner" *ngIf="isLoading"></div>
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </div>
      </button>
    </form>

    <div class="login-footer">
      <p>Identifiants de test :</p>
      <p><strong>Utilisateur :</strong> Administrator</p>
      <p><strong>Mot de passe :</strong> ness123.</p>
    </div>
  </div>
</div>
